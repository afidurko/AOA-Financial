# Cross-repo aids for ATTL / second brain / Cursor multi-root workspaces
repos:
  - name: AOA-Financial
    url: https://github.com/afidurko/AOA-Financial
    role: primary runtime
    workspace: .
  - name: loop-engineering
    url: https://github.com/afidurko/loop-engineering
    role: loop patterns, audit, budget shapes
  - name: spine
    url: https://github.com/afidurko/spine
    role: feature-spine note layout
    workspace: ./spine
    setup: ./scripts/spine-setup.sh
  - name: obsidian-second-brain
    url: https://github.com/afidurko/obsidian-second-brain
    role: living vault / _CLAUDE.md habits
    workspace: ./obsidian-second-brain
    setup: ./scripts/obsidian-second-brain-setup.sh
  - name: obsidian-skills
    url: https://github.com/afidurko/obsidian-skills
    role: Obsidian markdown / bases / canvas skill formats
    workspace: ./obsidian-skills
    setup: ./scripts/obsidian-skills-setup.sh
  - name: AutoHedge
    url: https://github.com/afidurko/AutoHedge
    role: swarm worker role separation
  - name: FinancePy
    url: https://github.com/afidurko/FinancePy
    role: derivatives pricing reference
  - name: py-moomoo-api
    url: https://github.com/afidurko/py-moomoo-api
    role: broker API reference (upstream MoomooOpen/py-moomoo-api)
    workspace: ./py-moomoo-api
  - name: qm
    url: https://github.com/afidurko/qm
    role: multiplayer agent harness (Slack + web); AOA_QM_URL companion
    workspace: ./qm
    setup: ./scripts/qm-setup.sh
  - name: example-hftish
    url: https://github.com/afidurko/example-hftish
    role: Alpaca order-book imbalance tick-taker reference; Python ideas in aoa.research.hftish_patterns

# Vendored / local workspaces (not separate git clones)
local:
  - name: AOA-Vault
    path: ./AOA-Vault
    role: Obsidian vault shared by Spine + obsidian-second-brain
  - name: brain
    path: ./brain
    role: ATTL second-brain mesh (Nova)
  - name: moomooapi
    path: ./.cursor/skills/moomooapi
    role: Moomoo OpenAPI market data & trading skill (vendored)
  - name: install-moomoo-opend
    path: ./.cursor/skills/install-moomoo-opend
    role: Moomoo OpenD installer skill (vendored)

# Multi-root Cursor workspace file regenerated by scripts/write-aoa-workspace.sh
code_workspace: AOA.code-workspace
knowledge_stack_setup: ./scripts/knowledge-stack-setup.sh
